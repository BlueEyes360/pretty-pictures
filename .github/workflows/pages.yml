name: Publish Pretty Pictures

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      refresh_catalog:
        description: Refresh the published selection from Harvard before deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Refresh Harvard discovery catalog
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_catalog
        env:
          HARVARD_API_KEY: ${{ secrets.HARVARD_API_KEY }}
        run: npm run refresh:discovery
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build:pages
      - name: Check public artifact
        env:
          HARVARD_API_KEY: ${{ secrets.HARVARD_API_KEY }}
        run: node scripts/check-pages-artifact.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:pages
      - name: Retain the refreshed JSON for later releases
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/discovery.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Harvard discovery catalog'
            git push origin HEAD:master
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
